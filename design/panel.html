<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@200..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .stage { background: linear-gradient(180deg, #0f1114 0%, #0a0b0d 100%); }

  /* Rail: time, then the TV's own places */
  .rail {
    position: absolute; left: 0; top: 0; bottom: 0; width: 470px; padding: 76px 48px 0 64px;
    background: linear-gradient(180deg, #16181c 0%, #111316 100%);
    box-shadow: 1px 0 0 rgba(255,255,255,.05), 30px 0 60px -30px rgba(0,0,0,.8);
    z-index: 2;
  }
  .rail .js-time { display: block; font-weight: 200; font-size: 128px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin-left: -6px; }
  .rail .js-date { display: block; margin-top: 14px; font-size: 27px; color: var(--ink-2); }
  .nav { margin-top: 84px; display: flex; flex-direction: column; gap: 6px; }
  .ni {
    height: 76px; padding: 0 22px; border-radius: 20px; display: flex; align-items: center; gap: 20px;
    font-size: 29px; font-weight: 500; color: #c9ccd1;
    transition: background-color 200ms var(--ease), color 200ms var(--ease);
  }
  .ni .icon { width: 30px; height: 30px; }
  .ni .sub { display: block; font-size: 21px; font-weight: 400; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
  .ni .chev { margin-left: auto; width: 22px; height: 22px; transition: transform 300ms var(--ease); opacity: .6; }
  .ni.open .chev { transform: rotate(90deg); }
  .ni.current { background: rgba(255,255,255,.06); color: #fff; }
  .ni.focus { background: var(--ink); color: #0b0c0e; box-shadow: 0 16px 30px -12px rgba(0,0,0,.8); }
  .ni.focus .sub { color: #4a4e55; }
  .subs { overflow: hidden; max-height: 0; transition: max-height 380ms var(--ease); }
  .subs.open { max-height: 400px; }
  .si { height: 62px; margin-left: 50px; padding: 0 20px; border-radius: 16px; display: flex; align-items: center; gap: 16px; font-size: 25px; color: #b9bdc3; }
  .si .icon { width: 26px; height: 26px; color: var(--ink-3); }
  .si .note { margin-left: auto; font-size: 19px; color: var(--ink-3); }
  .si.focus { background: var(--ink); color: #0b0c0e; }
  .si.focus .icon, .si.focus .note { color: #0b0c0e; }
  .stage[data-region="content"] .ni.focus { background: rgba(255,255,255,.06); color: #fff; box-shadow: none; }

  /* Content */
  .content { position: absolute; left: 470px; right: 0; top: 0; bottom: 0; overflow: hidden; }
  .glow {
    position: absolute; width: 1100px; height: 800px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, currentColor, transparent); opacity: .2; pointer-events: none;
    transition: left 520ms var(--ease), top 520ms var(--ease), color 600ms linear, opacity 300ms var(--ease);
  }
  .stage[data-region="rail"] .glow { opacity: .08; }
  .scroll { position: absolute; left: 80px; right: 120px; top: 0; transition: transform 560ms var(--ease); }
  .h { position: absolute; left: 0; font-size: 30px; font-weight: 500; color: var(--ink-2); transition: color 300ms var(--ease); }
  .h.active { color: #fff; }
  .mosaic { position: absolute; left: 0; right: 0; top: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px 40px; }
  .apps { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 66px 32px; }
  .tile { position: relative; }
  .tile .card {
    box-shadow: 0 14px 30px -16px rgba(0,0,0,.9);
    transition: transform 320ms var(--ease), box-shadow 320ms var(--ease);
  }
  .mosaic .card { border-radius: 22px; }
  .tile .card::after { content: ""; position: absolute; inset: 0; background: #000; opacity: .4; transition: opacity 260ms var(--ease); }
  .tile .card::before {
    content: ""; position: absolute; inset: 0; z-index: 1; opacity: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,0) 36%); transition: opacity 300ms var(--ease);
  }
  .stage[data-region="rail"] .tile .card::after { opacity: .55; }
  .tile.focus .card { transform: translateY(-6px) scale(1.045); box-shadow: 0 40px 70px -24px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.07); }
  .apps .tile.focus .card { transform: translateY(-4px) scale(1.1); }
  .tile.focus .card::after { opacity: 0; }
  .tile.focus .card::before { opacity: 1; }
  .tile .name {
    position: absolute; left: 0; right: 0; top: calc(100% + 18px); text-align: center; font-size: 24px; font-weight: 500;
    opacity: 0; transition: opacity 220ms var(--ease);
  }
  .tile.focus .name { opacity: 1; }
  .mosaic .tile .name { text-align: left; top: auto; bottom: 22px; left: 26px; font-size: 30px; z-index: 2; text-shadow: 0 2px 12px rgba(0,0,0,.6); opacity: 0; }
</style>
</head>
<body>
<!--
THESIS: The TV's places live in a rail; the apps live in a mosaic. Refuses the floating pill bar and the single undifferentiated grid.
OWN-WORLD: graphite ground (#0f1114), one lighter rail (#16181c) with a 1px seam and a long side shadow; Albert Sans 200 clock at 128px in the rail; 2x2 mosaic of 22px-radius favourite tiles, then a 4-column library; focus = light chip in the rail, lift + sheen + tinted glow on tiles.
STORY: the clock and the TV controls are always on the left; the right is only what you watch.
FIRST VIEWPORT: rail 470px wide with time, date and Inicio / Entradas / Red / Ajustes; Favoritas heading and a 2x2 mosaic filling the right; Todas las apps peeking below.
FORM: Panel, concept 2 of 3 requested by the owner; seed key 102228a1.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<div class="stage" id="stage" data-region="content">
  <aside class="rail">
    <span class="js-time">11:46</span>
    <span class="js-date">miércoles, 21 de octubre</span>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="content">
    <div class="glow" id="glow"></div>
    <div class="scroll" id="scroll">
      <div class="h active" id="hFav" style="top: 92px">Favoritas</div>
      <div class="mosaic" id="mosaic"></div>
      <div class="h" id="hApps" style="top: 936px">Todas las apps</div>
      <div class="apps" id="apps" style="top: 994px"></div>
    </div>
  </main>
</div>
<script src="common.js"></script>
<script>
const stage = document.getElementById("stage");
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

// Rail entries; Entradas expands in place
const nav = document.getElementById("nav");
const RAIL = [];
function railItem(icon, label, sub, extra = "") {
  const n = document.createElement("div");
  n.className = "ni";
  n.innerHTML = ICONS[icon] + `<span>${label}${sub ? `<span class="sub">${sub}</span>` : ""}</span>` + extra;
  nav.append(n);
  return n;
}
const niHome = railItem("home", "Inicio");
const niInputs = railItem("inputs", "Entradas", null, chev);
const subs = document.createElement("div");
subs.className = "subs"; nav.append(subs);
const SUBS = INPUTS.map(i => {
  const s = document.createElement("div");
  s.className = "si"; s.innerHTML = ICONS[i.icon] + `<span>${i.name}</span>` + (i.note ? `<span class="note">${i.note}</span>` : "");
  subs.append(s); return s;
});
const niNet = railItem("wifi", "Red", SSID);
const niSet = railItem("settings", "Ajustes");
niHome.classList.add("current");

const mosaic = document.getElementById("mosaic"), apps = document.getElementById("apps");
function tileEl(app, size) {
  const t = document.createElement("div");
  t.className = "tile";
  const n = document.createElement("div"); n.className = "name"; n.textContent = app.name;
  t.append(cardEl(app, size), n);
  return t;
}
const FT = FAVS.map(a => { const t = tileEl(a, 64); t.querySelector(".card").append(t.querySelector(".name")); mosaic.append(t); return t; });
const LT = LIB.map(a => { const t = tileEl(a, 34); apps.append(t); return t; });

// Rail focus list depends on whether Entradas is expanded
const st = { region: "content", rail: 0, inputsOpen: false, area: "fav", fav: 0, lib: 0 };
function railList() { return st.inputsOpen ? [niHome, niInputs, ...SUBS, niNet, niSet] : [niHome, niInputs, niNet, niSet]; }

function cx(el) { const r = el.getBoundingClientRect(); return r.left + r.width / 2; }
function nearest(list, x) { let b = 0, d = 1e9; list.forEach((e, i) => { const dd = Math.abs(cx(e) - x); if (dd < d) { d = dd; b = i; } }); return b; }

function render() {
  stage.dataset.region = st.region;
  [...railList(), ...SUBS, ...FT, ...LT].forEach(e => e.classList.remove("focus"));
  subs.classList.toggle("open", st.inputsOpen);
  niInputs.classList.toggle("open", st.inputsOpen);
  let tile = null, app = null;
  if (st.region === "rail") railList()[st.rail].classList.add("focus");
  else if (st.area === "fav") { tile = FT[st.fav]; app = FAVS[st.fav]; }
  else { tile = LT[st.lib]; app = LIB[st.lib]; }
  if (tile) tile.classList.add("focus");
  document.getElementById("hFav").classList.toggle("active", st.area === "fav");
  document.getElementById("hApps").classList.toggle("active", st.area === "lib");

  // Scroll: the mosaic owns the first screen; library rows bring themselves up
  let y = 0;
  if (st.area === "lib") { const row = Math.floor(st.lib / 4); y = -(840 + Math.max(0, row - 1) * 232); }
  if (st.area === "fav" && st.fav >= 2) y = -60;
  document.getElementById("scroll").style.transform = `translateY(${y}px)`;

  const glowTile = tile || (st.area === "fav" ? FT[st.fav] : LT[st.lib]);
  const glowApp = app || (st.area === "fav" ? FAVS[st.fav] : LIB[st.lib]);
  const g = document.getElementById("glow");
  const card = glowTile.querySelector(".card");
  // place in content coordinates at the destination scroll offset
  const sc = document.getElementById("scroll");
  const left = card.offsetLeft + glowTile.offsetLeft + glowTile.parentElement.offsetLeft + sc.offsetLeft + card.offsetWidth / 2;
  const top = glowTile.offsetTop + glowTile.parentElement.offsetTop + y + card.offsetHeight / 2 + 40;
  g.style.left = left + "px"; g.style.top = top + "px"; g.style.color = glowApp.glow;
}

addEventListener("keydown", e => {
  if (!NAV_KEYS.includes(e.key)) return;
  e.preventDefault();
  const k = e.key;
  if (st.region === "rail") {
    const list = railList();
    if (k === "ArrowDown") st.rail = Math.min(list.length - 1, st.rail + 1);
    if (k === "ArrowUp") st.rail = Math.max(0, st.rail - 1);
    if (k === "Enter" && list[st.rail] === niInputs) st.inputsOpen = !st.inputsOpen;
    if (k === "Enter" && list[st.rail] === niHome) st.region = "content";
    if (k === "ArrowRight" || k === "Escape" || k === "Backspace") {
      if (st.inputsOpen && (k !== "ArrowRight")) { st.inputsOpen = false; st.rail = 1; }
      else st.region = "content";
    }
  } else if (st.area === "fav") {
    const col = st.fav % 2, row = Math.floor(st.fav / 2);
    if (k === "ArrowLeft") { if (col > 0) st.fav--; else { st.region = "rail"; } }
    if (k === "ArrowRight" && col < 1) st.fav++;
    if (k === "ArrowUp" && row > 0) st.fav -= 2;
    if (k === "ArrowDown") {
      if (row < 1) st.fav += 2;
      else { st.lib = nearest(LT.slice(0, 4), cx(FT[st.fav])); st.area = "lib"; }
    }
  } else {
    const col = st.lib % 4, row = Math.floor(st.lib / 4);
    if (k === "ArrowLeft") { if (col > 0) st.lib--; else st.region = "rail"; }
    if (k === "ArrowRight" && col < 3 && st.lib + 1 < LT.length) st.lib++;
    if (k === "ArrowDown" && st.lib + 4 < LT.length) st.lib += 4;
    if (k === "ArrowUp") { if (row > 0) st.lib -= 4; else { st.fav = 2 + nearest(FT.slice(2), cx(LT[st.lib])); st.area = "fav"; } }
    if (k === "Escape" || k === "Backspace") st.area = "fav";
  }
  render();
});

fitStage(stage);
startClock();
mountChrome("panel.html");
document.fonts.ready.then(render);
render();
</script>
</body>
</html>
