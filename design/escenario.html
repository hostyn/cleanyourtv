<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escenario launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@200..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* Ground tinted by the focused app, darkening toward the shelf */
  .tint { position: absolute; inset: 0; transition: background-color 700ms var(--ease); }
  .tint::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(5,6,7,.92) 0%, rgba(5,6,7,.55) 38%, rgba(5,6,7,0) 70%),
      linear-gradient(180deg, rgba(5,6,7,0) 0%, rgba(5,6,7,.2) 50%, rgba(5,6,7,.96) 76%, #050607 100%);
  }

  /* Top bar */
  .bar { position: absolute; left: 120px; right: 120px; top: 60px; height: 72px; display: flex; align-items: center; }
  .clock { display: flex; align-items: baseline; gap: 22px; }
  .clock .js-time { font-weight: 300; font-size: 54px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .clock .js-date { font-size: 26px; color: rgba(255,255,255,.62); }
  .controls { margin-left: auto; display: flex; gap: 8px; }
  .ctl {
    height: 72px; min-width: 72px; padding: 0 20px; border-radius: 36px;
    display: flex; align-items: center; gap: 0; color: rgba(255,255,255,.82);
    transition: background-color 240ms var(--ease), color 240ms var(--ease), gap 300ms var(--ease);
  }
  .ctl .lbl { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; font-size: 26px; font-weight: 500;
    transition: max-width 360ms var(--ease), opacity 240ms var(--ease); }
  .ctl.focus { background: var(--ink); color: #0b0c0e; gap: 14px; box-shadow: 0 14px 30px -10px rgba(0,0,0,.7); }
  .ctl.focus .lbl { max-width: 420px; opacity: 1; }

  /* The stage: focused app at scale */
  .hero-text { position: absolute; left: 120px; top: 318px; width: 720px; }
  .hero-name {
    font-weight: 300; font-size: 104px; line-height: 1.02; letter-spacing: -0.035em;
    transition: opacity 260ms var(--ease), transform 420ms var(--ease);
  }
  .hero-meta { margin-top: 22px; font-size: 28px; color: rgba(255,255,255,.66); display: flex; align-items: center; gap: 14px; }
  .hero-meta .key {
    display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px;
    border-radius: 10px; background: rgba(255,255,255,.12); color: #fff; font-size: 20px; font-weight: 600; letter-spacing: .04em;
  }
  .swap { opacity: 0; transform: translateY(12px); }

  .hero-art { position: absolute; left: 900px; top: 176px; width: 900px; }
  .hero-art .halo {
    position: absolute; left: -200px; right: -200px; top: -160px; bottom: -200px;
    background: radial-gradient(closest-side, currentColor, transparent); opacity: .38;
    transition: color 700ms linear;
  }
  .hero-art .card {
    position: absolute; inset: 0 auto auto 0; width: 900px; border-radius: 24px;
    box-shadow: 0 70px 120px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.06);
    transition: opacity 360ms var(--ease), transform 520ms var(--ease);
  }
  .hero-art .card::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(160deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 34%);
  }
  .hero-art .card.out { opacity: 0; transform: translateX(40px) scale(.97); }
  .hero-art .card.synthetic { font-size: 120px; }

  /* The shelf: every app in one row; focus stays at the left edge */
  .shelf { position: absolute; left: 0; right: 0; top: 760px; height: 320px; }
  .track { position: absolute; left: 120px; top: 0; transition: transform 520ms var(--ease); }
  .group { position: absolute; top: 0; }
  .group-label { position: absolute; top: 0; font-size: 26px; font-weight: 500; color: rgba(255,255,255,.55); white-space: nowrap; transition: color 300ms var(--ease); }
  .group.active .group-label { color: #fff; }
  .tile { position: absolute; top: 58px; width: 280px; }
  .tile .card {
    border-radius: 14px; box-shadow: 0 12px 26px -14px rgba(0,0,0,.9);
    transition: transform 320ms var(--ease), box-shadow 320ms var(--ease), opacity 260ms var(--ease);
    opacity: .58;
  }
  .tile.focus .card {
    opacity: 1; transform: translateY(-10px) scale(1.14);
    box-shadow: 0 30px 50px -16px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.08);
  }
  .tile .card::before {
    content: ""; position: absolute; inset: 0; z-index: 1; opacity: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 38%);
    transition: opacity 300ms var(--ease);
  }
  .tile.focus .card::before { opacity: 1; }
  .stage[data-region="top"] .tile .card { opacity: .4; }

  /* Inputs menu */
  .menu {
    position: absolute; z-index: 5; top: 150px; right: 120px; width: 380px; padding: 10px;
    background: #1a1c20; border-radius: 24px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.07);
    opacity: 0; transform: translateY(-10px) scale(.98); transform-origin: top right; pointer-events: none;
    transition: opacity 220ms var(--ease), transform 300ms var(--ease);
  }
  .menu.open { opacity: 1; transform: none; }
  .mi { height: 68px; padding: 0 20px; border-radius: 16px; display: flex; align-items: center; gap: 18px; font-size: 26px; color: #d6d9dd; }
  .mi .icon { width: 28px; height: 28px; color: var(--ink-2); }
  .mi .note { margin-left: auto; font-size: 20px; color: var(--ink-3); }
  .mi.focus { background: var(--ink); color: #0b0c0e; }
  .mi.focus .icon, .mi.focus .note { color: #0b0c0e; }
</style>
</head>
<body>
<!--
THESIS: Home is a stage for one app at a time; a single shelf below feeds it. Refuses the dock-plus-grid wall.
OWN-WORLD: ground tinted by the focused app's colour and fading to near-black; Albert Sans 300 at 104px for the name; one 900px artwork card with a long shadow and a halo; a one-row shelf of 280px tiles whose focus stays pinned at the left edge.
STORY: glance, slide along the shelf, the stage tells you where you are, press OK.
FIRST VIEWPORT: compact clock and date top-left, bare icons top-right; app name and "OK Abrir" left at y 318; artwork card right at 900,176; shelf labelled Favoritas / Apps at y 760.
FORM: Escenario, concept 1 of 3 requested by the owner; seed key 102228a1.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<div class="stage" id="stage" data-region="shelf">
  <div class="tint" id="tint"></div>

  <div class="bar">
    <div class="clock"><span class="js-time">11:46</span><span class="js-date">miércoles, 21 de octubre</span></div>
    <div class="controls" id="controls"></div>
  </div>
  <div class="menu" id="menu"></div>

  <div class="hero-text"><div class="hero-name" id="heroName">TizenTube</div><div class="hero-meta" id="heroMeta"></div></div>
  <div class="hero-art" id="heroArt"><div class="halo" id="halo"></div></div>

  <div class="shelf"><div class="track" id="track"></div></div>
</div>
<script src="common.js"></script>
<script>
const stage = document.getElementById("stage");
const APPS = [...FAVS.map(a => ({ ...a, fav: true })), ...LIB];
const STEP = 304, GAP = 72, TILE = 280;

// Shelf: favourites group, then the rest, with a wider gap between the groups
const track = document.getElementById("track");
const tiles = [];
let x = 0;
[["Favoritas", APPS.filter(a => a.fav)], ["Apps", APPS.filter(a => !a.fav)]].forEach(([label, list], gi) => {
  const g = document.createElement("div");
  g.className = "group"; g.style.left = x + "px";
  g.innerHTML = `<div class="group-label">${label}</div>`;
  list.forEach((app, i) => {
    const t = document.createElement("div");
    t.className = "tile"; t.style.left = (i * STEP) + "px";
    t.append(cardEl(app, 34));
    g.append(t);
    tiles.push({ el: t, app, x: x + i * STEP, group: g });
  });
  track.append(g);
  x += list.length * STEP - (STEP - TILE) + GAP;
});
const trackWidth = x - GAP;

const controls = document.getElementById("controls");
const CTLS = [["inputs", "Entradas"], ["wifi", SSID], ["settings", "Ajustes"]].map(([ic, lbl]) => {
  const c = document.createElement("div");
  c.className = "ctl"; c.innerHTML = ICONS[ic] + `<span class="lbl">${lbl}</span>`;
  controls.append(c); return c;
});
const menu = document.getElementById("menu");
const MENU = INPUTS.map(i => {
  const m = document.createElement("div");
  m.className = "mi"; m.innerHTML = ICONS[i.icon] + `<span>${i.name}</span>` + (i.note ? `<span class="note">${i.note}</span>` : "");
  menu.append(m); return m;
});

const st = { region: "shelf", i: 0, top: 0, menu: 0, open: false };
let shown = -1;

function showHero(app) {
  const name = document.getElementById("heroName"), meta = document.getElementById("heroMeta");
  name.classList.add("swap");
  setTimeout(() => {
    name.textContent = app.name;
    meta.innerHTML = `<span class="key">OK</span> Abrir` + (app.fav ? ` &nbsp;·&nbsp; Favorita` : "");
    name.classList.remove("swap");
  }, 140);
  const art = document.getElementById("heroArt");
  const old = art.querySelector(".card");
  const c = cardEl(app, 120);
  c.classList.add("out");
  art.append(c);
  requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove("out")));
  if (old) { old.classList.add("out"); setTimeout(() => old.remove(), 400); }
  document.getElementById("halo").style.color = app.glow;
  document.getElementById("tint").style.backgroundColor = shade(app.glow, .36);
}

function render() {
  stage.dataset.region = st.open ? "top" : st.region;
  tiles.forEach(t => t.el.classList.remove("focus"));
  [...CTLS, ...MENU].forEach(e => e.classList.remove("focus"));
  document.querySelectorAll(".group").forEach(g => g.classList.remove("active"));
  menu.classList.toggle("open", st.open);
  const cur = tiles[st.i];
  if (st.open) { CTLS[0].classList.add("focus"); MENU[st.menu].classList.add("focus"); }
  else if (st.region === "top") CTLS[st.top].classList.add("focus");
  else cur.el.classList.add("focus");
  cur.group.classList.add("active");
  const tx = Math.min(cur.x, Math.max(0, trackWidth - 1680));
  track.style.transform = `translateX(${-tx}px)`;
  if (shown !== st.i) { shown = st.i; showHero(cur.app); }
}

addEventListener("keydown", e => {
  if (!NAV_KEYS.includes(e.key)) return;
  e.preventDefault();
  const k = e.key;
  if (st.open) {
    if (k === "ArrowDown") st.menu = Math.min(MENU.length - 1, st.menu + 1);
    else if (k === "ArrowUp") st.menu = Math.max(0, st.menu - 1);
    else st.open = false;
  } else if (st.region === "top") {
    if (k === "ArrowLeft") st.top = Math.max(0, st.top - 1);
    if (k === "ArrowRight") st.top = Math.min(CTLS.length - 1, st.top + 1);
    if (k === "ArrowDown" || k === "Escape" || k === "Backspace") st.region = "shelf";
    if (k === "Enter" && st.top === 0) { st.open = true; st.menu = 0; }
  } else {
    if (k === "ArrowLeft") st.i = Math.max(0, st.i - 1);
    if (k === "ArrowRight") st.i = Math.min(tiles.length - 1, st.i + 1);
    if (k === "ArrowUp") st.region = "top";
    if (k === "Escape" || k === "Backspace") st.i = 0;
  }
  render();
});

fitStage(stage);
startClock();
mountChrome("escenario.html");
render();
</script>
</body>
</html>
